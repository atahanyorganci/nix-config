packages:
  - packages/*
allowBuilds:
  "@google/genai": false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  workerd: false
overrides:
  # `@effect/platform-node` depends on `@effect/platform-node-shared` with a
  # floating `^4.0.0-rc.112`, which resolves to a build that needs a newer
  # `effect` than the catalog pins. Pin it so the two stay in step.
  "@effect/platform-node-shared": "4.0.0-rc.112"
catalog:
  "@distilled.cloud/aws": "1.0.0-rc.8"
  "@distilled.cloud/core": "1.0.0-rc.8"
  "@earendil-works/pi-ai": "0.86.0"
  "@earendil-works/pi-coding-agent": "0.86.0"
  "@earendil-works/pi-tui": "0.86.0"
  "@effect/language-service": "0.87.2"
  "@effect/platform-node": "4.0.0-rc.112"
  "@effect/platform-node-shared": "4.0.0-rc.112"
  "@effect/vitest": "4.0.0-rc.112"
  "@types/node": "^24.10.1"
  "alchemy": "2.0.0-beta.75"
  "effect": "4.0.0-rc.112"
  "oxfmt": "^0.51.0"
  "oxlint": "^1.66.0"
  "oxlint-tsgolint": "^0.23.0"
  "rolldown": "^1.2.9"
  "turbo": "^2.10.5"
  "typebox": "^1.3.34"
  "typescript": "^7.0.2"
  "vitest": "^4.1.8"
