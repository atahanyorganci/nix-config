name: NetBird Packages

# Releases are cut by pushing a `netbird/v<version>` tag (see `just
# netbird-release`). A rebuild of the same version, e.g. after a nixpkgs bump,
# is either a `netbird/v<version>+N` tag or a manual run of this workflow.
on:
  push:
    tags: ["netbird/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            packages: netbird netbird-server netbird-proxy
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            packages: netbird
          - runner: macos-latest
            system: aarch64-darwin
            packages: netbird netbird-app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: atahanyorganci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # On a tag, every package must be at the tagged version (ignoring a `+N`
      # rebuild suffix). On a manual run, they must at least agree.
      - name: Check package versions
        run: |
          set -euo pipefail
          want=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            want="${GITHUB_REF_NAME#netbird/v}"
            want="${want%%+*}"
          fi
          for pkg in ${{ matrix.packages }}; do
            have="$(nix eval --raw --accept-flake-config ".#packages.${{ matrix.system }}.$pkg.version")"
            want="${want:-$have}"
            if [ "$have" != "$want" ]; then
              echo "::error::$pkg is at $have, expected $want"
              exit 1
            fi
          done
          echo "NetBird $want on ${{ matrix.system }}"

      - name: Build NetBird packages (${{ matrix.system }})
        run: |
          set -euo pipefail
          args=()
          for pkg in ${{ matrix.packages }}; do
            args+=(".#packages.${{ matrix.system }}.$pkg")
          done
          nix build -L --no-link --print-out-paths --accept-flake-config "${args[@]}" > out-paths

      - name: Push NetBird packages to Cachix
        run: cachix push atahanyorganci < out-paths
